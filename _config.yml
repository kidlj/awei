commits: https://github.com/kidlj/awei/commits/main

defaults:
- scope: 
    type: "blog"
  values:
    layout: "blog"
- scope:
    type: "note"
  values:
    layout: "note"
- scope:
    type: "wiki"
  values:
    layout: "wiki"

collections:
  blog:
    output: true
    permalink: /blog/:name
  note:
    output: true
    permalink: /note/:name
  wiki:
    output: true
    permalink: /wiki/:name