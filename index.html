    {% assign posts = site.blog | sort:"date" | reverse %}
    {% for post in posts %}

      <h2>
        <a href="{{ post.url }}">{{ post.title }}</a>
      </h2>
      <caption>
        {{ post.date | date_to_string }}
      </caption>
    </li>

  </ul>
